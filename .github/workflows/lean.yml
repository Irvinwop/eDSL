          lake env lean -DwarningAsError=true tests/CompilerClamp32.lean
          lake env lean -DwarningAsError=true tests/CorpusClamp32.lean
          lake env lean -DwarningAsError=true tests/GradingClamp32.lean
          lake env lean -DwarningAsError=true tests/ELFFunctionWindow.lean
