name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean project
        run: lake build EDSL edsl-certify edsl-certify-process edsl-certify-counter edsl-certify-mutex-worker
      - name: ISA, ELF, OS contracts and rejection properties
        run: |
          lake env lean -DwarningAsError=true tests/X86.lean
          lake env lean -DwarningAsError=true tests/Memory.lean
          lake env lean -DwarningAsError=true tests/AddressSpace.lean
          lake env lean -DwarningAsError=true tests/OSComposition.lean
          lake env lean -DwarningAsError=true tests/WordStore.lean
          lake env lean -DwarningAsError=true tests/ELF.lean
          lake env lean -DwarningAsError=true tests/Process.lean
          lake env lean -DwarningAsError=true tests/Write.lean
          lake env lean -DwarningAsError=true tests/ControlFlow.lean
          lake env lean -DwarningAsError=true tests/Ownership.lean
          lake env lean -DwarningAsError=true tests/Borrowing.lean
          lake env lean -DwarningAsError=true tests/Threads.lean
          lake env lean -DwarningAsError=true tests/AtomicExchange.lean
          lake env lean -DwarningAsError=true tests/OSAtomicExchange.lean
          lake env lean -DwarningAsError=true tests/Atomics.lean
          lake env lean -DwarningAsError=true tests/AtomicThreads.lean
          lake env lean -DwarningAsError=true tests/FetchAdd.lean
          lake env lean -DwarningAsError=true tests/CounterThreads.lean
          lake env lean -DwarningAsError=true tests/CounterThreadsWitness.lean
          lake env lean -DwarningAsError=true tests/Mutex.lean
          lake env lean -DwarningAsError=true tests/MutexISA.lean
          lake env lean -DwarningAsError=true tests/MutexReplay.lean
          lake env lean -DwarningAsError=true tests/MutexInvariant.lean
          lake env lean -DwarningAsError=true tests/MutexExecution.lean
          lake env lean -DwarningAsError=true tests/StoreBuffer.lean
          lake env lean -DwarningAsError=true tests/TSO.lean
          lake env lean -DwarningAsError=true tests/MutexTSO.lean
      - name: Audit transitive axiom dependencies
        run: bash scripts/check-audit.sh
      - name: Replay stored proofs through a fresh kernel environment
        run: lake env leanchecker --fresh EDSL
      - name: Install native integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 gcc binutils
      - name: Certify fresh C and C++ compiler outputs and execute owned fixtures
        env:
          EDSL_CLANG: clang-18
          EDSL_CLANGXX: clang++-18
        run: bash scripts/verify-compilers.sh
      - name: Certify standalone process bytes and observe native exit
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-process.sh
      - name: Certify counted loops and observe bounded native inputs
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-loops.sh
      - name: Certify fetch-add and compare arithmetic flags with native observations
        env:
          EDSL_CLANG: clang-18
          EDSL_CLANGXX: clang++-18
        run: bash scripts/verify-fetch-add.sh
      - name: Certify counter loops and observe owned threaded workloads
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-counter-workers.sh
      - name: Observe protected payloads using certified exchange/load/store bytes
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-mutex.sh
      - name: Certify complete mutex workers and observe owned workloads
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-mutex-workers.sh
      - name: Preserve owned fixture certificates and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-fixture-certificates
          path: artifacts/compiler-fixtures/
          if-no-files-found: error
      - name: Preserve owned loop certificates and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loop-fixture-certificates
          path: artifacts/loop-fixtures/
          if-no-files-found: error
      - name: Preserve owned process certificates and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-fixture-certificates
          path: artifacts/process-fixtures/
          if-no-files-found: error
      - name: Preserve owned fetch-add certificates and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetch-add-fixture-certificates
          path: artifacts/fetch-add-fixtures/
          if-no-files-found: error
      - name: Preserve owned counter-worker certificates and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counter-worker-fixture-certificates
          path: artifacts/counter-worker-fixtures/
          if-no-files-found: error
      - name: Preserve owned mutex native observations and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutex-fixture-observations
          path: artifacts/mutex-fixtures/
          if-no-files-found: error
      - name: Preserve owned mutex-worker certificates and observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutex-worker-fixture-certificates
          path: artifacts/mutex-worker-fixtures/
          if-no-files-found: error
