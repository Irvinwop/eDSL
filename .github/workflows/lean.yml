name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      # Always invoke Lake: its input traces invalidate changed modules. Cached
      # outputs never skip contract tests, axiom audits, or fresh kernel replay.
      - name: Build pinned Lean project
        run: lake build EDSL edsl-certify edsl-certify-process edsl-certify-counter edsl-certify-mutex-worker edsl-certify-futex edsl-certify-futex-client edsl-certify-sum32 edsl-cfg-import edsl-grade edsl-proof-export GradingFixtures
      - name: ISA, ELF, OS contracts and rejection properties
        run: |
          lake env lean -DwarningAsError=true tests/X86.lean
          lake env lean -DwarningAsError=true tests/Memory.lean
          lake env lean -DwarningAsError=true tests/AddressSpace.lean
          lake env lean -DwarningAsError=true tests/OSComposition.lean
          lake env lean -DwarningAsError=true tests/WordStore.lean
          lake env lean -DwarningAsError=true tests/ELF.lean
          lake env lean -DwarningAsError=true tests/Process.lean
          lake env lean -DwarningAsError=true tests/Write.lean
          lake env lean -DwarningAsError=true tests/ControlFlow.lean
          lake env lean -DwarningAsError=true tests/Ownership.lean
          lake env lean -DwarningAsError=true tests/Borrowing.lean
          lake env lean -DwarningAsError=true tests/Threads.lean
          lake env lean -DwarningAsError=true tests/AtomicExchange.lean
          lake env lean -DwarningAsError=true tests/OSAtomicExchange.lean
          lake env lean -DwarningAsError=true tests/Atomics.lean
          lake env lean -DwarningAsError=true tests/AtomicThreads.lean
          lake env lean -DwarningAsError=true tests/FetchAdd.lean
          lake env lean -DwarningAsError=true tests/CounterThreads.lean
          lake env lean -DwarningAsError=true tests/CounterThreadsWitness.lean
          lake env lean -DwarningAsError=true tests/Mutex.lean
          lake env lean -DwarningAsError=true tests/MutexISA.lean
          lake env lean -DwarningAsError=true tests/MutexReplay.lean
          lake env lean -DwarningAsError=true tests/MutexInvariant.lean
          lake env lean -DwarningAsError=true tests/MutexExecution.lean
          lake env lean -DwarningAsError=true tests/StoreBuffer.lean
          lake env lean -DwarningAsError=true tests/TSO.lean
          lake env lean -DwarningAsError=true tests/MutexTSO.lean
          lake env lean -DwarningAsError=true tests/Suspend.lean
          lake env lean -DwarningAsError=true tests/FutexResources.lean
          lake env lean -DwarningAsError=true tests/FutexStubs.lean
          lake env lean -DwarningAsError=true tests/FutexService.lean
          lake env lean -DwarningAsError=true tests/FutexPhysical.lean
          lake env lean -DwarningAsError=true tests/FutexAdmission.lean
          lake env lean -DwarningAsError=true tests/FutexClientFrames.lean
          lake env lean -DwarningAsError=true tests/FutexClientControl.lean
          lake env lean -DwarningAsError=true tests/FutexClientPhysical.lean
          lake env lean -DwarningAsError=true tests/FutexClientCertificate.lean
          lake env lean -DwarningAsError=true tests/FutexClientCoverage.lean
          lake env lean -DwarningAsError=true tests/SequentialISA.lean
          lake env lean -DwarningAsError=true tests/SequentialExecution.lean
          lake env lean -DwarningAsError=true tests/SequentialMoves.lean
          lake env lean -DwarningAsError=true tests/SequentialMoveResources.lean
          lake env lean -DwarningAsError=true tests/ArrayResources.lean
          lake env lean -DwarningAsError=true tests/Sum32Pointer.lean
          lake env lean -DwarningAsError=true tests/Sum32Index.lean
          lake env lean -DwarningAsError=true tests/Sum32Artifact.lean
          lake env lean -DwarningAsError=true tests/CFG.lean
          lake env lean -DwarningAsError=true tests/Stride32.lean
          lake env lean -DwarningAsError=true tests/Pair32.lean
          lake env lean -DwarningAsError=true tests/Pair32Resources.lean
          lake env lean -DwarningAsError=true tests/GradingDomain.lean
          lake env lean -DwarningAsError=true tests/GradingTask.lean
          lake env lean -DwarningAsError=true tests/GradingWrite.lean
          lake env lean -DwarningAsError=true tests/Write32Accounting.lean
          lake env lean -DwarningAsError=true tests/GradingArtifact.lean
          lake env lean -DwarningAsError=true tests/GradingDriver.lean
          lake env lean -DwarningAsError=true tests/GradingRuntime.lean
          lake env lean -DwarningAsError=true tests/GradingDAG.lean
          lake env lean -DwarningAsError=true tests/StrideMov.lean
          lake env lean -DwarningAsError=true tests/WriteIntermediate.lean
      - name: Audit transitive axiom dependencies
        run: bash scripts/check-audit.sh
      - name: Replay stored proofs through a fresh kernel environment
        run: lake env leanchecker --fresh EDSL
      - name: Install native integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 gcc gcc-13 binutils
      - name: Certify fresh C and C++ compiler outputs and execute owned fixtures
        env:
          EDSL_CLANG: clang-18
          EDSL_CLANGXX: clang++-18
        run: bash scripts/verify-compilers.sh
      - name: Certify standalone process bytes and observe native exit
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-process.sh
      - name: Certify counted loops and observe bounded native inputs
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-loops.sh
      - name: Certify fetch-add and compare arithmetic flags with native observations
        env:
          EDSL_CLANG: clang-18
          EDSL_CLANGXX: clang++-18
        run: bash scripts/verify-fetch-add.sh
      - name: Certify counter loops and observe owned threaded workloads
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-counter-workers.sh
      - name: Observe protected payloads using certified exchange/load/store bytes
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-mutex.sh
      - name: Certify complete mutex workers and observe owned workloads
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-mutex-workers.sh
      - name: Certify private futex stubs and observe installed-kernel results
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-futex.sh
      - name: Certify publishing futex clients and observe owned native publication
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-futex-clients.sh
      - name: Certify ordinary sum32 loops and observe owned native calls
        env:
          EDSL_GCC: gcc-13
          EDSL_CLANG: clang-18
        run: bash scripts/verify-sum32.sh
      - name: Replay owned MOV32 CPU observations through Lean
        env:
          EDSL_CLANG: clang-18
        run: bash scripts/verify-sequential-moves.sh
      - name: Preserve owned MOV32 observations and kernel checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequential-moves-evidence
          path: artifacts/sequential-moves/
          if-no-files-found: error
      - name: Preserve owned sum32 certificates and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sum32-fixture-certificates
          path: artifacts/sum32-fixtures/
          if-no-files-found: error
      - name: Check finite CFG imports and observe owned native functions
        env:
          EDSL_GCC: gcc-13
        run: bash scripts/verify-cfg.sh
      - name: Grade exact artifacts against fixed tasks with data-only proofs
        env:
          EDSL_GCC: gcc-13
        run: bash scripts/verify-grading.sh
      - name: Preserve owned proof-grading evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grading-fixture-evidence
          path: artifacts/grading-fixtures/
          if-no-files-found: error
      - name: Preserve owned CFG imports and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cfg-fixture-evidence
          path: artifacts/cfg-fixtures/
          if-no-files-found: error
      - name: Preserve owned publishing-client certificates and observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: futex-client-fixture-certificates
          path: artifacts/futex-client-fixtures/
          if-no-files-found: error
      - name: Preserve owned futex certificates and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: futex-fixture-certificates
          path: artifacts/futex-fixtures/
          if-no-files-found: error
      - name: Preserve owned fixture certificates and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-fixture-certificates
          path: artifacts/compiler-fixtures/
          if-no-files-found: error
      - name: Preserve owned loop certificates and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loop-fixture-certificates
          path: artifacts/loop-fixtures/
          if-no-files-found: error
      - name: Preserve owned process certificates and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-fixture-certificates
          path: artifacts/process-fixtures/
          if-no-files-found: error
      - name: Preserve owned fetch-add certificates and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetch-add-fixture-certificates
          path: artifacts/fetch-add-fixtures/
          if-no-files-found: error
      - name: Preserve owned counter-worker certificates and native observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counter-worker-fixture-certificates
          path: artifacts/counter-worker-fixtures/
          if-no-files-found: error
      - name: Preserve owned mutex native observations and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutex-fixture-observations
          path: artifacts/mutex-fixtures/
          if-no-files-found: error
      - name: Preserve owned mutex-worker certificates and observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutex-worker-fixture-certificates
          path: artifacts/mutex-worker-fixtures/
          if-no-files-found: error
