          lake env lean -DwarningAsError=true tests/GradingDriver.lean
          lake env lean -DwarningAsError=true tests/GradingRuntime.lean
          lake env lean -DwarningAsError=true tests/GradingDAG.lean
          lake env lean -DwarningAsError=true tests/StrideMov.lean
          lake env lean -DwarningAsError=true tests/WriteIntermediate.lean
          lake env lean -DwarningAsError=true tests/WriteMoves.lean
      - name: Audit transitive axiom dependencies
        run: bash scripts/check-audit.sh
      - name: Check bounded byte scans and current buffer resources
        run: lake build BoundedScanTests
      - name: Compare byte flags and read footprints with native x86-64
        run: bash scripts/check-sequential-byte-native.sh
      - name: Check first-match search contracts and instruction semantics
        env:
          LEAN_NUM_THREADS: '1'
        run: flock /tmp/edsl-lean-build.lock lake build IndexSearchTests
      - name: Compare search instructions with finite native x86-64 observations
        env:
          CC: gcc-13
        run: bash scripts/check-sequential-search-native.sh
      - name: Check paired byte contracts, instruction widths and current input loans
        env:
          LEAN_NUM_THREADS: '1'
        run: flock /tmp/edsl-lean-build.lock lake build ByteComparisonTests
      - name: Compare byte-order instructions with finite native x86-64 observations
        env:
          CC: gcc-13
        run: bash scripts/check-sequential-byte-order-native.sh
      - name: Replay stored proofs through a fresh kernel environment
        run: lake env leanchecker --fresh EDSL.All

  managed-fetch-add64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore shared production proofs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
            lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      # Save only test proof outputs here; build-and-audit owns the shared
      # production cache. Lake checks source and dependency traces on every run.
      - name: Cache managed concurrency test proofs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build/lib/lean/tests
            .lake/build/ir/tests
          key: lake-managed-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-managed-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-
            lake-managed-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
      - name: Build managed concurrency contracts and regressions
        run: lake build ManagedFetchAdd64Tests
      - name: Audit imported managed concurrency proofs
        run: lake env lean -DwarningAsError=true tests/ManagedFetchAdd64Audit.lean

  # Run independent native domains beside contracts and fresh proof replay.
  # Compiler fixtures stay with mutex checks, which consume and re-certify
  # their exact bytes. Each shard has its own checkout, build tree and locks.
  native-domains:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        domain: [compiler-os, sequential-cfg, pointer-results, counted-stores, unary-registers, counter-displacement, shift-one]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      # build-and-audit writes the shared Lake cache. Shards restore it
      # without racing to save the same immutable key.
      - name: Restore Lake build outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
            lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      # Reuse the same Lean version across target/dependency configuration
      # changes. Lake invalidates affected inputs; the final v1 prefix permits
      # migration from the previous cache format without a cold build.
      # Always invoke Lake: its input traces invalidate changed modules.
      # Runtime checks, explicit audits and fresh production replay still run.
      - name: Build pinned Lean project
        # The instruction-only runners build and snapshot their own minimal
        # production closure. The full catalogue is already a separate job.
        if: ${{ matrix.domain != 'unary-registers' && matrix.domain != 'counter-displacement' && matrix.domain != 'shift-one' }}
        run: lake build EDSL.All edsl-certify edsl-certify-process edsl-certify-counter edsl-certify-mutex-worker edsl-certify-futex edsl-certify-futex-client edsl-certify-futex-predicate edsl-certify-sum32 edsl-cfg-import edsl-grade edsl-grade-call-stack edsl-grade-call-memory64 edsl-grade-call-memory-loop64 edsl-proof-export edsl-certify-store-return32 edsl-certify-store-load64 edsl-certify-counted-store64 edsl-certify-counted-store64-clang GradingFixtures VerificationTests UnaryTests
      - name: Install native integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 gcc gcc-13 binutils shellcheck
      - name: Replay owned NEG32 and BSWAP64 CPU observations through Lean
        if: ${{ matrix.domain == 'unary-registers' }}
        env:
          CXX: clang++-18
        run: bash scripts/verify-sequential-unary.sh
      - name: Preserve owned unary observations and kernel checks
        if: ${{ always() && matrix.domain == 'unary-registers' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequential-unary-evidence
          path: .cache/unary-registers/native/run.*/
          include-hidden-files: true
          if-no-files-found: error
      - name: Replay owned ADD32, INC32 and displaced LEA CPU observations through Lean
        if: ${{ matrix.domain == 'counter-displacement' }}
        env:
          CXX: clang++-18
        run: bash scripts/verify-counter-displacement.sh
      - name: Preserve counter and displacement observations and kernel checks
        if: ${{ always() && matrix.domain == 'counter-displacement' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counter-displacement-evidence
          path: .cache/popcount/native/run.*/
          include-hidden-files: true
          if-no-files-found: error
      - name: Replay owned SHR64 CPU observations through Lean
        if: ${{ matrix.domain == 'shift-one' }}
        env:
          CXX: clang++-18
        run: bash scripts/verify-shift-one.sh
      - name: Preserve owned shift observations and kernel checks
        if: ${{ always() && matrix.domain == 'shift-one' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequential-shift-one-evidence
          path: .cache/shift-average/native-replay/run.*/
