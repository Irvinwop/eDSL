          lake env lean -DwarningAsError=true tests/CountedStore64Clang.lean
          lake env lean -DwarningAsError=true tests/GradingCountedStore64.lean
          lake env lean -DwarningAsError=true tests/CountedStoreFinal64.lean
          lake env lean -DwarningAsError=true tests/StoreReturn32Raw.lean
          lake env lean -DwarningAsError=true tests/StoreReturn32Resources.lean
          lake env lean -DwarningAsError=true tests/GradingStoreReturn.lean
          lake env lean -DwarningAsError=true tests/GradingStoreReturnValue64.lean
