name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository layout
        run: bash scripts/check-repository-layout.sh
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
            lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-
      # Reuse the same Lean version across target/dependency configuration
      # changes. Lake invalidates affected inputs; the final v1 prefix permits
      # migration from the previous cache format without a cold build.
      # Always invoke Lake: its input traces invalidate changed modules.
      # Runtime checks, explicit audits and fresh production replay still run.
      - name: Build pinned Lean project
        run: lake build EDSL.All edsl-certify edsl-certify-process edsl-certify-counter edsl-certify-mutex-worker edsl-certify-futex edsl-certify-futex-client edsl-certify-futex-predicate edsl-certify-sum32 edsl-cfg-import edsl-grade edsl-grade-call-stack edsl-grade-call-memory64 edsl-grade-call-memory-loop64 edsl-proof-export edsl-certify-store-return32 edsl-certify-store-load64 edsl-certify-counted-store64 edsl-certify-counted-store64-clang GradingFixtures VerificationTests UnaryTests PopcountTests AverageTests ParityTests RotationTests Low8Tests ByteEqualityTests CFGProfileTests AtomicAccess64Tests BoundedScanTests IndexSearchTests ByteComparisonTests WholeQWordTests ManagedQueue64Tests
      - name: ISA, ELF, OS contracts and rejection properties
        run: |
          lake env lean -DwarningAsError=true tests/X86.lean
          lake env lean -DwarningAsError=true tests/Memory.lean
          lake env lean -DwarningAsError=true tests/Memory64.lean
          lake env lean -DwarningAsError=true tests/AddressSpace.lean
          lake env lean -DwarningAsError=true tests/OSComposition.lean
          lake env lean -DwarningAsError=true tests/WordStore.lean
          lake env lean -DwarningAsError=true tests/ELF.lean
          lake env lean -DwarningAsError=true tests/Process.lean
          lake env lean -DwarningAsError=true tests/Write.lean
          lake env lean -DwarningAsError=true tests/ControlFlow.lean
          lake env lean -DwarningAsError=true tests/Ownership.lean
          lake env lean -DwarningAsError=true tests/Ownership64.lean
          lake env lean -DwarningAsError=true tests/OwnershipRead64.lean
          lake env lean -DwarningAsError=true tests/StackFrameResources.lean
          lake env lean -DwarningAsError=true tests/CallReturnRaw.lean
          lake env lean -DwarningAsError=true tests/StackFrameCPU.lean
          lake env lean -DwarningAsError=true tests/CallStack.lean
          lake env lean -DwarningAsError=true tests/CallStackAdmission.lean
          lake env lean -DwarningAsError=true tests/CallStackDomain.lean
          lake env lean -DwarningAsError=true tests/CallStackCoverage.lean
          lake env lean -DwarningAsError=true tests/GradingCallStackContract.lean
          lake env lean -DwarningAsError=true tests/CallMemory64Resources.lean
          lake env lean -DwarningAsError=true tests/CallMemory64CapacityDomain.lean
          lake env lean -DwarningAsError=true tests/CallMemory64Cutpoints.lean
          lake env lean -DwarningAsError=true tests/CallMemory64Private.lean
          lake env lean -DwarningAsError=true tests/CallMemory64Domain.lean
          lake env lean -DwarningAsError=true tests/CallMemory64CPU.lean
          lake env lean -DwarningAsError=true tests/CallMemory64Contract.lean
          lake env lean -DwarningAsError=true tests/GradingCallMemory64Artifact.lean
          lake env lean -DwarningAsError=true tests/GradingCallMemoryLoop64Artifact.lean
          lake env lean -DwarningAsError=true tests/Borrowing.lean
          lake env lean -DwarningAsError=true tests/Threads.lean
          lake env lean -DwarningAsError=true tests/AtomicExchange.lean
          lake env lean -DwarningAsError=true tests/OSAtomicExchange.lean
          lake env lean -DwarningAsError=true tests/Atomics.lean
          lake env lean -DwarningAsError=true tests/AtomicMemory64.lean
          lake env lean -DwarningAsError=true tests/LockedLogical64Execution.lean
          lake env lean -DwarningAsError=true tests/Atomics64.lean
          lake env lean -DwarningAsError=true tests/Atomics64History.lean
          lake env lean -DwarningAsError=true tests/Atomics64Machine.lean
          lake env lean -DwarningAsError=true tests/AtomicThreads64.lean
          lake env lean -DwarningAsError=true tests/Logical64Ordered.lean
          lake env lean -DwarningAsError=true tests/AtomicSetThreads64.lean
          lake env lean -DwarningAsError=true tests/AtomicSetThreads64Adversarial.lean
          lake env lean -DwarningAsError=true tests/AtomicLogical64Artifact.lean
