    if: ${{ always() }}
    needs: native-domains
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native and grading domain to pass
        env:
          DOMAIN_RESULT: ${{ needs.native-domains.result }}
        run: test "$DOMAIN_RESULT" = success
