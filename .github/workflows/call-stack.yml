name: Owned nested-call compiler contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache call-stack build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-call-stack-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-call-stack-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-
            lake-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
      - name: Install native integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 gcc-13 binutils shellcheck libssl-dev file
      - name: Verify actual compiler text, native contracts and universal Lean proofs
        env:
          LEAN_NUM_THREADS: 1
          CALL_STACK_EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/call-stack
        run: bash scripts/verify-call-stack.sh
      - name: Preserve compact synthetic verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-stack-receipts
          path: |
            artifacts/call-stack/**/result.txt
            artifacts/call-stack/**/terminal-status.txt
            artifacts/call-stack/**/SHA256SUMS
            artifacts/call-stack/**/MANIFEST-SHA256.txt
            artifacts/call-stack/**/entry-binding.txt
            artifacts/call-stack/**/formal/*.log
            artifacts/call-stack/**/formal/*.lean
            artifacts/call-stack/**/formal/*SHA256SUMS
            artifacts/call-stack/**/formal/proof-sources.tar.gz
          if-no-files-found: warn
